
name: Build Open World APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Preparar projeto
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip
          unzip -o Open_World_Projeto_Android_compilacao_nuvem.zip -d projeto
          find projeto -name gradlew -type f -exec chmod +x {} \;
          echo "PROJECT_DIR=$(dirname "$(find projeto -name gradlew -type f | head -n 1)")" >> "$GITHUB_ENV"

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Open-World-APK
          path: projeto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
