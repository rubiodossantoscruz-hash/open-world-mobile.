name: Build Open World APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"
      - "*.zip"

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Gradle correto
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Instalar ferramentas
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

      - name: Preparar projeto
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p projeto
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          if [ -z "$ZIP_FILE" ]; then
            echo "ERRO: ZIP nao encontrado"
            exit 1
          fi
          unzip -o "$ZIP_FILE" -d projeto
          BUILD_FILE=$(find projeto -type f \( -name build.gradle -o -name build.gradle.kts \) -print -quit)
          if [ -z "$BUILD_FILE" ]; then
            echo "ERRO: build.gradle nao encontrado"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$BUILD_FILE")
          while [ "$PROJECT_DIR" != "projeto" ] && [ ! -f "$PROJECT_DIR/settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; do
            PROJECT_DIR=$(dirname "$PROJECT_DIR")
          done
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Compilar APK
        run: |
          cd "$PROJECT_DIR"
          gradle assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Open-World-APK
          path: projeto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
