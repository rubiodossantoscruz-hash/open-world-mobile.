name: Build Open World APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"
      - "*.zip"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar projeto
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip
          mkdir -p projeto
          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          echo "ZIP encontrado: $ZIP_FILE"
          test -n "$ZIP_FILE"
          unzip -o "$ZIP_FILE" -d projeto
          GRADLEW=$(find projeto -type f -name gradlew -print -quit)
          if [ -z "$GRADLEW" ]; then
            echo "ERRO: o ZIP nao contem o arquivo gradlew."
            echo "Arquivos encontrados:"
            find projeto -maxdepth 4 -type f | head -100
            exit 1
          fi
          chmod +x "$GRADLEW"
          echo "PROJECT_DIR=$(dirname "$GRADLEW")" >> "$GITHUB_ENV"

      - name: Compilar APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          ./gradlew assembleDebug --no-daemon

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Open-World-APK
          path: projeto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
