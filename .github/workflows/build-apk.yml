name: Build Open World APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-apk.yml"
      - "*.zip"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Preparar projeto
        shell: bash
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y unzip gradle
          mkdir -p projeto

          ZIP_FILE=$(find . -maxdepth 1 -type f -iname '*.zip' -print -quit)
          echo "ZIP encontrado: $ZIP_FILE"
          test -n "$ZIP_FILE"
          unzip -o "$ZIP_FILE" -d projeto

          GRADLEW=$(find projeto -type f -name gradlew -print -quit)

          if [ -n "$GRADLEW" ]; then
            chmod +x "$GRADLEW"
            PROJECT_DIR=$(dirname "$GRADLEW")
            USE_SYSTEM_GRADLE=false
          else
            BUILD_FILE=$(find projeto -type f -name build.gradle -print -quit)
            test -n "$BUILD_FILE"
            PROJECT_DIR=$(dirname "$BUILD_FILE")

            while [ "$PROJECT_DIR" != "projeto" ] && [ ! -f "$PROJECT_DIR/settings.gradle" ] && [ ! -f "$PROJECT_DIR/settings.gradle.kts" ]; do
              PROJECT_DIR=$(dirname "$PROJECT_DIR")
            done

            USE_SYSTEM_GRADLE=true
          fi

          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          echo "USE_SYSTEM_GRADLE=$USE_SYSTEM_GRADLE" >> "$GITHUB_ENV"

      - name: Compilar APK
        shell: bash
        run: |
          cd "$PROJECT_DIR"
          if [ "$USE_SYSTEM_GRADLE" = "true" ]; then
            gradle assembleDebug --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: Open-World-APK
          path: projeto/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
